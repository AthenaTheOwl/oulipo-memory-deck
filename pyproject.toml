[project]
name = "oulipo-memory-deck"
version = "0.1.0"
description = "narrative card deck with deterministic S+7 word swaps"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oulipo_memory_deck"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py311"
