id: hinge
object: hinge
base_line: "the hinge holds the door."
s_plus_7_line: "the handle holds the lamp."
vignette: >-
  the handle holds the lamp. when the power went out in the storm, her
  father walked the hallway carrying a small reading lamp by its
  handle, the cord trailing useless behind him like a tail. he set it
  on the table where it stood unlit, and they ate by the light of two
  candles. he never let go of the handle.
