s_plus_7_line: "the speaker faces the bowl."
vignette: >-
  the speaker faces the bowl. in the dining room the old hi-fi
  speaker had been angled toward the fruit bowl on the table, as if
  the bowl were the audience. she remembered her uncle dancing alone
  there one new year's eve, holding a glass and conducting the
  speaker with his free hand while everyone else slept upstairs.
