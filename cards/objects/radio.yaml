id: radio
object: radio
base_line: "the radio sits on the shelf."
s_plus_7_line: "the button sits on the pan."
vignette: >-
  the button sits on the pan. her grandmother kept a button jar by the
  stove, a glass jar full of old buttons clipped from worn shirts.
  once a button rolled out onto a frying pan that had not yet been
  wiped clean. her grandmother fished it out with a fingernail, washed
  it, returned it to the jar. nothing was ever thrown away in that
  house.
