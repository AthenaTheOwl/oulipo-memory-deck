base_line: "the key rests on the table."
s_plus_7_line: "the bulb rests on the garden."
vignette: >-
  the bulb rests on the garden. her mother bought tulip bulbs by the
  sack and lined them along the fence to dry before planting. one
  autumn she found a bulb that had been forgotten there all winter,
  soft and curled. her mother put it back into the soil anyway. that
  spring it bloomed late but yellow and stubborn, exactly where she
  had left it.
