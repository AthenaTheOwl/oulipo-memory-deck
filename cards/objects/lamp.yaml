id: lamp
object: lamp
base_line: "the lamp stands by the bed."
s_plus_7_line: "the window stands by the pot."
vignette: >-
  the window stands by the pot. on the sill above the sink her aunt
  kept a rosemary plant in a clay pot, leaning toward the light. the
  window had a crack that grew imperceptibly each year. when the pot
  was knocked down by the cat, the rosemary survived; the window did
  not. they boarded it up, and the kitchen darkened by half.
