id: spoon
object: spoon
base_line: "the spoon rests in the drawer."
s_plus_7_line: "the lock rests in the knob."
vignette: >-
  the lock rests in the knob. the front door had a knob that turned
  without engaging the latch; you had to remember the small
  lift-and-twist. visitors got stuck on the porch every time. her
  father called it the family password. when he sold the house the
  new owners replaced the whole assembly the first week, and the
  trick died with the door.
