id: kettle
object: kettle
base_line: "the kettle sits on the stove."
s_plus_7_line: "the drawer sits on the spoon."
vignette: >-
  the drawer sits on the spoon. she remembers a kitchen in the old
  house: a silverware drawer that would not close because someone had
  left a ladle out, and the spoon stuck under it, propping the whole
  assembly open. her grandmother said leave it. it stayed for years, a
  small absurd monument that no one explained, and that no one moved.
